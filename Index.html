<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ውዷ ሊድያዬ ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-1: #090b1d;
        --bg-2: #1b1234;
        --bg-3: #3b1f4d;
        --glass: rgba(255, 255, 255, 0.12);
        --glass-border: rgba(255, 255, 255, 0.2);
        --soft-pink: #ff7bbd;
        --pink: #ff4fa3;
        --rose: #ff7aa9;
        --gold: #ffd76a;
        --white: #fdfaff;
        --text: #f9ebff;
        --shadow: rgba(255, 90, 161, 0.38);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: "Noto Sans Ethiopic", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 100%);
        overflow: hidden;
      }

      body {
        position: relative;
      }

      #sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
        opacity: 0.92;
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px 170px;
      }

      .content {
        width: min(100%, 760px);
        text-align: center;
        margin-top: 10vh;
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .title {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 4.4rem);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: 0.03em;
        color: #fff0fb;
        text-shadow: 0 0 18px rgba(255, 152, 204, 0.8), 0 0 32px rgba(255, 97, 184, 0.4);
      }

      .message {
        margin: 0;
        width: min(100%, 620px);
        font-size: clamp(1rem, 2.6vw, 1.7rem);
        line-height: 1.9;
        font-weight: 500;
        color: rgba(255, 245, 252, 0.98);
        text-shadow: 0 0 10px rgba(255, 140, 200, 0.2);
      }

      .typewriter-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 2px;
        background: rgba(255, 255, 255, 0.9);
        animation: blink 0.9s steps(1) infinite;
        vertical-align: middle;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .card {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: min(92vw, 430px);
        padding: 20px 18px 18px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 12px 40px rgba(18, 9, 26, 0.5),
          inset 0 0 22px rgba(255, 255, 255, 0.06),
          0 0 20px rgba(255, 126, 203, 0.14);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        z-index: 10;
      }

      .question {
        margin: 0 0 16px;
        font-size: clamp(1.1rem, 3vw, 1.5rem);
        text-align: center;
        line-height: 1.6;
        color: #fff7fe;
        text-shadow: 0 0 12px rgba(255, 174, 224, 0.35);
      }

      .button-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        appearance: none;
        border: none;
        outline: none;
        position: relative;
        cursor: pointer;
        border-radius: 16px;
        padding: 14px 18px;
        font-family: "Noto Sans Ethiopic", sans-serif;
        font-size: clamp(0.95rem, 2vw, 1.1rem);
        font-weight: 700;
        line-height: 1.2;
        transition: transform 0.2s ease, box-shadow 0.22s ease, filter 0.2s ease;
        white-space: nowrap;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-yes {
        background: linear-gradient(135deg, #ff5db1 0%, #ff8a5d 45%, #ffd66f 100%);
        color: #fff;
        box-shadow: 0 12px 28px rgba(255, 100, 164, 0.5), 0 0 18px rgba(255, 222, 121, 0.35);
      }

      .btn-yes:hover {
        transform: translateY(-2px) scale(1.01);
        filter: brightness(1.04);
      }

      .btn-no {
        background: rgba(255, 255, 255, 0.09);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.08);
        position: relative;
      }

      .btn-no:hover {
        transform: scale(1.03);
      }

      .popup {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(17, 8, 22, 0.2);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 30;
      }

      .popup.show {
        opacity: 1;
        pointer-events: auto;
      }

      .popup-box {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
          0 20px 60px rgba(26, 16, 34, 0.7),
          0 0 24px rgba(255, 120, 196, 0.28);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 22px;
        padding: 24px 28px;
        font-size: clamp(1.15rem, 3vw, 1.75rem);
        color: #fff7fc;
        text-align: center;
        line-height: 1.7;
        max-width: min(90vw, 480px);
        transform: scale(0.75) translateY(22px);
        transition: transform 0.38s ease;
      }

      .popup.show .popup-box {
        transform: scale(1) translateY(0);
      }

      @media (max-width: 480px) {
        .page {
          padding-bottom: 210px;
        }

        .card {
          bottom: 14px;
          width: min(94vw, 420px);
          border-radius: 22px;
          padding: 18px 16px 16px;
        }

        .button-row {
          gap: 10px;
        }

        .btn {
          width: 100%;
        }

        .btn-no {
          width: 38%;
          min-width: 86px;
        }

        .btn-yes {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="sky"></canvas>

    <div class="page">
      <div class="content">
        <div class="hero">
          <h1 class="title" id="titleText"></h1>
          <p class="message" id="messageText"></p>
        </div>
      </div>
    </div>

    <div class="card" id="loveCard">
      <p class="question">ሁሌም የኔ ትሆኛለሽ?</p>
      <div class="button-row">
        <button class="btn btn-yes" id="yesBtn">አዎ፣ እስከመጨረሻው ❤️</button>
        <button class="btn btn-no" id="noBtn" type="button">አይ</button>
      </div>
    </div>

    <div class="popup" id="popup">
      <div class="popup-box">እኔም በጣም እወድሻለሁ ሊድያዬ! ❤️✨</div>
    </div>

    <script>
      const titleText = "ውዷ ሊድያዬ ❤️";
      const messageText = "አንቺ በሕይወቴ ውስጥ የገባሽ ልዩ ስጦታ ነሽ። ሁሌም ከጎኔ ስለሆንሽ አመሰግናለሁ!";

      function typeWriter(element, text, speed = 50) {
        let index = 0;

        function tick() {
          if (index <= text.length) {
            element.innerHTML = text.slice(0, index) + '<span class="typewriter-cursor"></span>';
            index++;
            setTimeout(tick, speed);
          } else {
            element.innerHTML = text + '<span class="typewriter-cursor" style="opacity:0;"></span>';
          }
        }

        tick();
      }

      setTimeout(() => {
        typeWriter(document.getElementById("titleText"), titleText, 60);
      }, 200);

      setTimeout(() => {
        typeWriter(document.getElementById("messageText"), messageText, 35);
      }, 700);

      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const particles = [];
      const floatingHearts = [];

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createParticle() {
        return {
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 2.2 + 0.8,
          alpha: Math.random() * 0.8 + 0.2,
          dx: (Math.random() - 0.5) * 0.4,
          dy: (Math.random() * 0.5 + 0.2),
          color: `rgba(${255}, ${255}, ${255}, ${Math.random() * 0.8 + 0.2})`
        };
      }

      function initParticles() {
        particles.length = 0;
        const count = Math.max(80, Math.min(180, Math.floor(window.innerWidth / 10)));
        for (let i = 0; i < count; i++) {
          particles.push(createParticle());
        }
      }

      function createFloatingHeart() {
        floatingHearts.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: Math.random() * 18 + 10,
          speedY: Math.random() * 0.5 + 0.3,
          speedX: (Math.random() - 0.5) * 0.7,
          drift: Math.random() * Math.PI * 2,
          hue: Math.random() > 0.5 ? "pink" : "rose",
          alpha: Math.random() * 0.5 + 0.25
        });
      }

      function drawHeart(x, y, size, color, alpha = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();

        const scale = size / 18;

        ctx.moveTo(0, 8 * scale);
        ctx.bezierCurveTo(-10 * scale, -2 * scale, -18 * scale, -12 * scale, 0, -22 * scale);
        ctx.bezierCurveTo(18 * scale, -12 * scale, 10 * scale, -2 * scale, 0, 8 * scale);
        ctx.closePath();

        ctx.fillStyle = color.replace(")", `, ${alpha})`).replace("rgb", "rgba");
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.restore();
      }

      function seedHearts() {
        floatingHearts.length = 0;
        const total = Math.max(12, Math.min(28, Math.floor(window.innerWidth / 30)));
        for (let i = 0; i < total; i++) {
          createFloatingHeart();
        }
      }

      function animateSky() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        const gradient = ctx.createRadialGradient(
          window.innerWidth * 0.5,
          window.innerHeight * 0.25,
          50,
          window.innerWidth * 0.5,
          window.innerHeight * 0.55,
          window.innerWidth * 0.8
        );
        gradient.addColorStop(0, "rgba(93, 59, 123, 0.22)");
        gradient.addColorStop(0.45, "rgba(22, 14, 39, 0.08)");
        gradient.addColorStop(1, "rgba(7, 8, 18, 0.0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        for (const particle of particles) {
          particle.x += particle.dx;
          particle.y += particle.dy;

          if (particle.y > window.innerHeight + 6) {
            particle.y = -6;
            particle.x = Math.random() * window.innerWidth;
          }
          if (particle.x < 0 || particle.x > window.innerWidth) {
            particle.x = Math.random() * window.innerWidth;
          }

          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
          ctx.fillStyle = particle.color;
          ctx.fill();
        }

        for (const heart of floatingHearts) {
          heart.x += heart.speedX + Math.sin(heart.drift) * 0.12;
          heart.y += heart.speedY * 0.8;
          heart.drift += 0.03;

          if (heart.y > window.innerHeight + 30) {
            heart.y = -20;
            heart.x = Math.random() * window.innerWidth;
          }
          if (heart.x < -30) heart.x = window.innerWidth + 30;
          if (heart.x > window.innerWidth + 30) heart.x = -30;

          const color = heart.hue === "pink"
            ? "rgba(255, 107, 188, 1)"
            : "rgba(255, 142, 204, 1)";
          drawHeart(heart.x, heart.y, heart.size, color, heart.alpha);
        }

        requestAnimationFrame(animateSky);
      }

      function burstHearts(x, y, count = 40) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.8;
          const velocity = randomBetween(1.4, 4.4);
          const heart = document.createElement("div");
          heart.className = "celebration-heart";
          heart.style.position = "fixed";
          heart.style.left = x + "px";
          heart.style.top = y + "px";
          heart.style.width = "18px";
          heart.style.height = "18px";
          heart.style.pointerEvents = "none";
          heart.style.zIndex = "40";
          heart.style.color = i % 2 === 0 ? "#ff7bc8" : "#ffd56f";
          heart.style.textShadow = "0 0 18px rgba(255, 120, 185, 0.8)";
          heart.style.transform = "translate(-50%, -50%)";
          heart.style.opacity = "1";
          heart.style.fontSize = randomBetween(16, 26) + "px";
          heart.textContent = "❤";
          document.body.appendChild(heart);

          const dx = Math.cos(angle) * velocity;
          const dy = Math.sin(angle) * velocity - 0.8;
          heart.animate(
            [
              { transform: "translate(-50%, -50%) scale(0.5)", opacity: 1 },
              { transform: `translate(${dx * 22}px, ${dy * 22}px) scale(1.15)`, opacity: 1 },
              { transform: `translate(${dx * 48}px, ${dy * 48 - 12}px) scale(0.5)`, opacity: 0 }
            ],
            { duration: 1200 + Math.random() * 700, easing: "cubic-bezier(.12,.8,.22,1)", fill: "forwards" }
          );

          setTimeout(() => heart.remove(), 1800);
        }
      }

      function burstConfetti(x, y, count = 80) {
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("span");
          piece.style.position = "fixed";
          piece.style.left = x + "px";
          piece.style.top = y + "px";
          piece.style.width = "10px";
          piece.style.height = "16px";
          piece.style.pointerEvents = "none";
          piece.style.background = i % 3 === 0 ? "#ff7ed1" : i % 3 === 1 ? "#ffe27c" : "#b7f2ff";
          piece.style.borderRadius = "2px";
          piece.style.zIndex = "40";
          piece.style.transform = "translate(-50%, -50%) rotate(0deg)";
          piece.style.opacity = "1";
          document.body.appendChild(piece);

          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.8;
          const velocity = randomBetween(2, 7);
          const dx = Math.cos(angle) * velocity;
          const dy = Math.sin(angle) * velocity;

          piece.animate(
            [
              { transform: "translate(-50%, -50%) rotate(0deg)", opacity: 1 },
              { transform: `translate(${dx * 18}px, ${dy * 18}px) rotate(${Math.random() * 360}deg)`, opacity: 1 },
              { transform: `translate(${dx * 44}px, ${dy * 44 + 18}px) rotate(${Math.random() * 520}deg)`, opacity: 0 }
            ],
            { duration: 1300 + Math.random() * 600, easing: "cubic-bezier(.18,.8,.22,1)", fill: "forwards" }
          );

          setTimeout(() => piece.remove(), 1800);
        }
      }

      function showPopup() {
        const popup = document.getElementById("popup");
        popup.classList.add("show");

        setTimeout(() => {
          popup.classList.remove("show");
        }, 2600);
      }

      function dodgeNo() {
        const noBtn = document.getElementById("noBtn");
        const pad = 16;
        const maxX = window.innerWidth - noBtn.offsetWidth - pad;
        const maxY = window.innerHeight - noBtn.offsetHeight - pad;
        const x = Math.random() * Math.max(pad, maxX - pad) + pad;
        const y = Math.random() * Math.max(pad, maxY - pad) + pad;

        noBtn.style.position = "fixed";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
        noBtn.style.transform = "none";
        noBtn.style.zIndex = "25";
        noBtn.style.transition = "left 0.28s ease, top 0.28s ease";
      }

      window.addEventListener("resize", () => {
        resizeCanvas();
        initParticles();
        seedHearts();
      });

      document.getElementById("yesBtn").addEventListener("click", () => {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight * 0.42;
        burstHearts(centerX, centerY, 80);
        burstConfetti(centerX, centerY, 120);
        showPopup();
      });

      document.getElementById("noBtn").addEventListener("pointerenter", dodgeNo);
      document.getElementById("noBtn").addEventListener("touchstart", (event) => {
        event.preventDefault();
        dodgeNo();
      }, { passive: false });

      resizeCanvas();
      initParticles();
      seedHearts();
      animateSky();
    </script>
  </body>
</html>
